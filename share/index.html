<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share my location</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#02060d;color:#9fd8f5;font:16px/1.5 system-ui,sans-serif;padding:16px}
main{max-width:420px;width:100%;border:1px solid #19b5ff55;padding:20px;background:#04101c}
h1{font-size:18px;letter-spacing:.15em;color:#19b5ff;margin:0 0 12px}
button{width:100%;background:#19b5ff;color:#00131f;border:0;font-weight:700;padding:14px;font-size:16px;margin-top:8px;cursor:pointer}
textarea{width:100%;box-sizing:border-box;background:#020a12;color:#2dffb0;border:1px solid #19b5ff55;padding:10px;font:14px monospace;margin-top:12px}
a{color:#ff9d2e}#msg{color:#ff9d2e;margin-top:10px}
</style></head><body><main>
<h1>SHARE MY LOCATION</h1>
<p>Tapping the button asks your device for its location. Nothing is sent anywhere: you copy the result and send it yourself.</p>
<button id="go">SHARE MY LOCATION</button>
<div id="msg"></div>
<div id="out" hidden>
<textarea id="txt" rows="2" readonly></textarea>
<button id="copy">COPY</button>
<button id="wa">SEND VIA WHATSAPP</button>
</div>
<script>
const $=id=>document.getElementById(id);
$('go').onclick=()=>{
  $('msg').textContent='Waiting for permission...';
  if(!navigator.geolocation){$('msg').textContent='Location not supported on this device.';return;}
  navigator.geolocation.getCurrentPosition(p=>{
    const t=`INTEL-LOC ${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)} acc=${Math.round(p.coords.accuracy)}m`;
    $('txt').value=t;$('out').hidden=false;$('msg').textContent='';
    $('wa').onclick=()=>location.href='https://wa.me/?text='+encodeURIComponent(t);
  },e=>{$('msg').textContent=e.code===1?'Permission denied.':'Could not get location.';},
  {enableHighAccuracy:true,timeout:20000,maximumAge:0});
};
$('copy').onclick=()=>{navigator.clipboard.writeText($('txt').value);$('copy').textContent='COPIED';};
</script></main></body></html>
